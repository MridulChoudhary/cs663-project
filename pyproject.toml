[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faithful-sr"
version = "0.1.0"
description = "CS663 project: faithful super-resolution for movie posters and digital artwork"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: longer tests (deselect with -m 'not slow')"]
